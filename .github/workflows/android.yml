name: Build Android native
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tautkan proses build
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'pending',context:'android-native',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,description:'Build APK native berjalan'});
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Uji backend dan parser struk
        run: |
          node tests/backend.test.cjs
          mkdir -p build/parser-test
          javac -d build/parser-test app/src/main/java/id/langkahberdua/app/ReceiptParser.java app/src/main/java/id/langkahberdua/app/Csv.java tests/ReceiptParserTest.java
          java -cp build/parser-test id.langkahberdua.app.ReceiptParserTest
      - run: gradle :app:assembleDebug --no-daemon
      - name: Aktifkan emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Uji Android dan OCR
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Android/data/id.langkahberdua.connected/files/beranda.png build/beranda.png
      - name: Simpan hasil pengujian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Langkah-Berdua-Hasil-Uji
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/beranda.png
      - uses: actions/upload-artifact@v4
        with:
          name: Langkah-Berdua-Android-Native
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Status akhir
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:process.env.BUILD_RESULT==='success'?'success':'failure',context:'android-native',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,description:'Build APK native selesai'});
